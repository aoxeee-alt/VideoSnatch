name: 构建 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: 准备 Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses" 2>/dev/null || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license" 2>/dev/null || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: 固定签名（保证新版本能覆盖安装）
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: videosnatch-debug-keystore-v1

      - name: 生成签名文件（如没有）
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon -q

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/VideoSnatch.apk
          ls -lh out

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: VideoSnatch-APK
          path: out/VideoSnatch.apk

      - name: 发布到 Releases（方便手机直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: "VideoSnatch 自动构建 #${{ github.run_number }}"
          body: "每次推送代码自动生成。接口失效时更新 rules.json 即可，App 会自动拉取新规则。"
          files: out/VideoSnatch.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
