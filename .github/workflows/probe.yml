name: 探测抖音接口

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 批量探测
        run: |
          python3 - <<'PY' > probe-result.txt
          import urllib.request, urllib.parse, ssl, json, re
          ID = "7686318782050422630"
          RAW = "https://www.iesdouyin.com/share/video/7686318782050422630/"
          ENC = urllib.parse.quote(RAW, safe="")
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          cands = [
            ("tenapi",       "https://tenapi.cn/v2/douyinvideo?url=" + ENC),
            ("pearktrue",    "https://api.pearktrue.cn/api/video/?url=" + ENC),
            ("werplus",      "https://api.wer.plus/api/dy?url=" + ENC),
            ("52vmy",        "https://api.52vmy.cn/api/wl/top/douyin?url=" + ENC),
            ("qjqq",         "https://api.qjqq.cn/api/douyin?url=" + ENC),
            ("lolimi",       "https://api.lolimi.cn/API/dy/?url=" + ENC),
            ("nsmao",        "https://api.nsmao.net/api/dy/?url=" + ENC),
            ("mmp",          "https://api.mmp.cc/api/douyin?url=" + ENC),
            ("douyinwtf",    "https://api.douyin.wtf/api?url=" + ENC),
            ("qqsuu",        "https://api.qqsuu.cn/api/dm-douyin?url=" + ENC),
            ("官方iteminfo",  "https://www.iesdouyin.com/web/api/v2/aweme/iteminfo/?item_ids=" + ID),
            ("官方分享页",    "https://www.iesdouyin.com/share/video/" + ID + "/"),
            ("官方网页",      "https://www.douyin.com/video/" + ID),
          ]
          keys = ["douyinvod", ".mp4", "play_addr", "playAddr", "playwm", "aweme_id", "video_id"]
          for name, url in cands:
              print("=" * 60)
              print("通道:", name)
              print("请求:", url[:120])
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode("utf-8", "ignore")
                      print("HTTP:", r.status, " 大小:", len(body))
                      hit = [k for k in keys if k in body]
                      print("命中关键字:", hit if hit else "无")
                      print("内容片段:", body[:400].replace("\n", " "))
              except Exception as e:
                  print("失败:", type(e).__name__, str(e)[:150])
              print()
          PY
          cat probe-result.txt

      - name: 保存结果
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@bot.local"
          git add probe-result.txt
          git commit -m "探测结果" || echo "无变化"
          git push || echo "推送失败"
