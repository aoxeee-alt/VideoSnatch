name: 探测抖音接口

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 批量探测（第2批）
        run: |
          python3 - <<'PY' > probe-result.txt
          import urllib.request, urllib.parse
          ID = "7686318782050422630"
          MOBILE = "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          SPIDER = "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          BINGBOT = "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)"
          ENC = urllib.parse.quote("https://www.iesdouyin.com/share/video/" + ID + "/", safe="")
          cands = [
            ("分享页+蜘蛛UA",  "https://www.iesdouyin.com/share/video/" + ID + "/", SPIDER),
            ("网页+蜘蛛UA",    "https://www.douyin.com/video/" + ID, SPIDER),
            ("分享页+必应UA",  "https://www.iesdouyin.com/share/video/" + ID + "/", BINGBOT),
            ("tiktokv-feed-a", "https://api22-normal-c-useast2a.tiktokv.com/aweme/v1/feed/?aweme_id=" + ID + "&version_code=300904&app_name=musical_ly&channel=googleplay&device_platform=android&device_type=Pixel&os_version=9&aid=1180", MOBILE),
            ("tiktokv-feed-b", "https://api16-normal-c-useast1a.tiktokv.com/aweme/v1/feed/?aweme_id=" + ID + "&version_code=300904&app_name=musical_ly&channel=googleplay&device_platform=android&device_type=Pixel&os_version=9&aid=1180", MOBILE),
            ("vvhan",          "https://api.vvhan.com/api/douyin?url=" + ENC, MOBILE),
            ("aa1",            "https://api.aa1.cn/api/douyin?url=" + ENC, MOBILE),
            ("oioweb",         "https://api.oioweb.cn/api/douyin?url=" + ENC, MOBILE),
            ("tangdouz",       "https://api.tangdouz.com/api/douyin.php?url=" + ENC, MOBILE),
            ("cenguigui",      "https://api.cenguigui.cn/api/douyin?url=" + ENC, MOBILE),
            ("xiaobaibk",      "https://api.xiaobaibk.cn/api/douyin?url=" + ENC, MOBILE),
            ("yyy001",         "https://api.yyy001.com/api/douyin?url=" + ENC, MOBILE),
          ]
          keys = ["douyinvod", ".mp4", "play_addr", "playAddr", "playwm", "aweme_id", "video_id", "play_addr_low"]
          for name, url, ua in cands:
              print("=" * 60)
              print("通道:", name)
              print("请求:", url[:130])
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read().decode("utf-8", "ignore")
                      print("HTTP:", r.status, " 大小:", len(body))
                      hit = [k for k in keys if k in body]
                      print("命中关键字:", hit if hit else "无")
                      print("内容片段:", body[:500].replace("\n", " "))
              except Exception as e:
                  print("失败:", type(e).__name__, str(e)[:150])
              print()
          PY
          cat probe-result.txt

      - name: 保存结果
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@bot.local"
          git add probe-result.txt
          git commit -m "探测结果第2批" || echo "无变化"
          git push || echo "推送失败"
